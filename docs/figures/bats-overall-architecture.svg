<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1250" viewBox="0 0 2400 1250">
  <defs>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0b0f19; }
      .layer-title { font: 700 30px Arial, Helvetica, sans-serif; fill: #0b0f19; }
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #0b0f19; }
      .small { font: 700 16px Arial, Helvetica, sans-serif; fill: #666; }
      .tiny { font: 600 14px Arial, Helvetica, sans-serif; fill: #666; }
      .blue { stroke: #075aa8; fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .blue-fill { fill: #075aa8; stroke: #075aa8; stroke-width: 3; }
      .pale { fill: #f6f9fc; }
      .green-pale { fill: #f6fbf7; }
      .dash { fill: none; stroke: #111; stroke-width: 2; stroke-dasharray: 5 5; }
      .arrow { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .blue-arrow { stroke: #075aa8; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .thin { stroke-width: 4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#075aa8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2400" height="1250" fill="#fff"/>

  <!-- Layer headings -->
  <text class="layer-title" x="610" y="55">Field Data Capture Layer</text>
  <text class="layer-title" x="1435" y="55">Backend Processing Layer</text>
  <text class="layer-title" x="445" y="690">Storage &amp; Anchoring Layer</text>
  <text class="layer-title" x="1450" y="690">Verification &amp; Governance Layer</text>

  <!-- Layer boxes -->
  <rect class="dash" x="330" y="85" width="860" height="330" rx="18"/>
  <rect class="dash" x="1255" y="85" width="790" height="330" rx="18"/>
  <rect class="dash" x="210" y="725" width="980" height="360" rx="18"/>
  <rect class="dash" x="1255" y="725" width="900" height="360" rx="18"/>

