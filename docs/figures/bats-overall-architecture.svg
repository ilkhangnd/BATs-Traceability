    <text class="label" x="1" y="275">GPS / Yield / Role</text>
  </g>

  <g transform="translate(1815,126)">
    <circle class="blue" cx="88" cy="80" r="53"/>
    <path class="blue" d="M88 27 v-22 M88 155 v-22 M35 80 H13 M163 80 h-22"/>
    <path class="blue" d="M58 80 h60 M88 50 v60"/>
    <path class="blue" d="M139 131 l35 35"/>
