  <path class="arrow" d="M865 415 C890 540 1040 625 1325 725"/>

  <text class="small" x="1195" y="1125">Merkle Proof + EPCIS JSON / PDF / CSV</text>
  <path class="arrow" d="M1425 1085 C1510 1175 1835 1175 1945 1088"/>

  <!-- Footer note -->
  <text class="tiny" x="62" y="1210">BATS Overall Architecture: Zalo Mini App capture → validated EPCIS event → PostgreSQL/PostGIS storage → daily Merkle anchoring → GS1 Digital Link verification.</text>
</svg>
