<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fbfcf8"/>
  <style>
    text{font-family:Inter,Arial,sans-serif;fill:#14251b}
    .title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#52625a}
    .axis{stroke:#85928b;stroke-width:1}.grid{stroke:#dfe5e0;stroke-width:1}
    .label{font-size:14px}.value{font-size:13px;font-weight:600}
  </style>
  <text x="75" y="58" class="title">Indexed PostGIS geofence latency</text>
  <text x="75" y="86" class="subtitle">Median of 10 measured ST_Contains queries after 3 warm-up runs</text>
  <line x1="90" y1="580" x2="1100" y2="580" class="axis"/>
    <rect x="120" y="236" width="150" height="344" rx="10" fill="#17683f"/>
      <text x="195" y="221" text-anchor="middle" class="value">0.064 ms</text>
      <text x="195" y="614" text-anchor="middle" class="label">100</text><rect x="360" y="322" width="150" height="258" rx="10" fill="#17683f"/>
      <text x="435" y="307" text-anchor="middle" class="value">0.048 ms</text>
      <text x="435" y="614" text-anchor="middle" class="label">1,000</text><rect x="600" y="322" width="150" height="258" rx="10" fill="#17683f"/>
      <text x="675" y="307" text-anchor="middle" class="value">0.048 ms</text>
      <text x="675" y="614" text-anchor="middle" class="label">10,000</text><rect x="840" y="311.25" width="150" height="268.75" rx="10" fill="#17683f"/>
      <text x="915" y="296.25" text-anchor="middle" class="value">0.050 ms</text>
      <text x="915" y="614" text-anchor="middle" class="label">100,000</text>
    <text x="34" y="365" transform="rotate(-90 34 365)" text-anchor="middle" class="label">Median execution time (ms)</text>
    <text x="600" y="680" text-anchor="middle" class="label">Registered farm-plot polygons</text>
</svg>